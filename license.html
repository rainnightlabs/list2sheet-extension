<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Activate List2Sheet Pro</title>
  <link rel="stylesheet" href="license.css">
</head>
<body>
  <main class="card">
    <div class="licenseTop">
      <div class="brand">Rainnight Labs</div>
      <select id="languageSelect" class="languageSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">简体中文</option>
      </select>
    </div>
    <h1 data-i18n="activateTitle">Activate List2Sheet Pro</h1>
    <p class="lead" data-i18n="activateLead">Use the purchase email and the L2S1... license generated after checkout.</p>

    <form id="licenseForm">
      <label>
        <span data-i18n="purchaseEmail">Purchase email</span>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <label>
        <span data-i18n="license">License</span>
        <textarea id="license" required rows="5" spellcheck="false" placeholder="L2S1..."></textarea>
      </label>
      <button id="activate" type="submit" data-i18n="verifyActivate">Verify and activate</button>
    </form>

    <div id="message" class="message" hidden></div>

    <section id="activeLicense" class="active" hidden>
      <strong data-i18n="proActive">Pro is active</strong>
      <p id="activeEmail"></p>
      <button id="deactivate" class="secondary" data-i18n="deactivate">Deactivate on this browser</button>
    </section>

    <p class="help">
      <span data-i18n="needLicense">Need a license?</span>
      <a href="https://www.rainnightlabs.com/pricing/" target="_blank" data-i18n="openPricing">Open Rainnight Labs pricing</a>.
    </p>
  </main>

  <script type="module" src="license.js"></script>
</body>
</html>
